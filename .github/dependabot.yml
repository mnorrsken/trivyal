version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # svelte-check supports only TypeScript 5 and 6 so far.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Follows the Node major the app is built with (24, LTS).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      web-deps:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Odd Node majors are short-lived; move to the next LTS by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Type check
        working-directory: web
        run: npm run check

      - name: Unit tests
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint
        run: helm lint charts/trivyal

      - name: Template
        run: |
          helm template t charts/trivyal > /dev/null
          helm template t charts/trivyal \
            --set auth.oidc.enabled=true,auth.oidc.issuerURL=https://idp.example.com \
            --set auth.oidc.clientID=c,auth.oidc.redirectURL=https://t.example.com/auth/callback \
            --set metrics.enabled=true,metrics.serviceMonitor.enabled=true,ingress.enabled=true > /dev/null

{{- if and .Values.auth.oidc.enabled (not .Values.auth.oidc.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trivyal.oidcSecretName" . }}
  labels:
    {{- include "trivyal.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-secret: {{ .Values.auth.oidc.clientSecret | quote }}
  {{- with .Values.auth.oidc.sessionKey }}
  session-key: {{ . | quote }}
  {{- end }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trivyal.fullname" . }}
  labels:
    {{- include "trivyal.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.persistence.enabled }}
  # The volume can be mounted by one pod at a time.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "trivyal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if and .Values.auth.oidc.enabled (not .Values.auth.oidc.existingSecret) }}
        checksum/oidc: {{ include (print $.Template.BasePath "/secret-oidc.yaml") . | sha256sum }}
        {{- end }}
      labels:
        {{- include "trivyal.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "trivyal.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: trivyal
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: METRICS_ADDR
              value: {{ if .Values.metrics.enabled }}{{ printf ":%v" .Values.metrics.port | quote }}{{ else }}""{{ end }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: DATABASE_URL
              value: sqlite:/data/trivyal.db
            {{- with .Values.auth.oidc }}
            {{- if .enabled }}
            - name: OIDC_ISSUER_URL
              value: {{ required "auth.oidc.issuerURL is required" .issuerURL | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ required "auth.oidc.clientID is required" .clientID | quote }}
            - name: OIDC_REDIRECT_URL
              value: {{ required "auth.oidc.redirectURL is required" .redirectURL | quote }}
            - name: OIDC_SCOPES
              value: {{ .scopes | quote }}
            - name: OIDC_GROUPS_CLAIM
              value: {{ .groupsClaim | quote }}
            - name: OIDC_ALLOWED_GROUPS
              value: {{ join "," .allowedGroups | quote }}
            - name: OIDC_ALLOWED_EMAILS
              value: {{ join "," .allowedEmails | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "trivyal.oidcSecretName" $ }}
                  key: client-secret
            - name: SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "trivyal.oidcSecretName" $ }}
                  key: session-key
                  optional: true
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "trivyal.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
